<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carve Lab Heater Scheduler</title>
  <style>
    :root{--ink:#182421;--muted:#61706b;--line:#d9e0d4;--cream:#f6f6ef;--mint:#ceef77;--forest:#183c34}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px Arial,sans-serif}.app{max-width:680px;margin:auto;padding:28px 18px 108px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:#55715e}.mark{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--forest);color:var(--mint);margin-right:6px;letter-spacing:0}h1{font-size:clamp(32px,9vw,48px);letter-spacing:-.055em;line-height:.96;margin:8px 0}h2{font-size:20px;margin:0 0 5px}.sub{margin:0 0 24px;color:var(--muted);font-size:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 9px 23px #203b3110}.grid{display:grid;gap:14px}.field{display:grid;gap:7px;margin-bottom:15px;font-size:13px;font-weight:700;color:#334740}input{width:100%;min-height:50px;border:1px solid #cdd8cf;border-radius:12px;background:#fbfcf8;padding:0 13px;font:inherit}input:focus{outline:3px solid #71b77133;border-color:#53885e}.note{font-weight:400;font-size:11px;color:var(--muted)}.head{display:flex;justify-content:space-between;gap:12px;margin:5px 0 13px}.head p{margin:0;color:var(--muted);font-size:12px}.badge{white-space:nowrap;padding:6px 9px;border-radius:999px;background:#edf4e7;color:#416946;font-size:11px;font-weight:800}.times{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr 84px;gap:9px}.row input,.remove{min-height:48px}.remove,.add,.generate,.copy{font-weight:800;border-radius:13px;cursor:pointer}.remove{border:1px solid #efc9b9;background:#fff9f5;color:#b35d3d}.add,.generate,.copy{width:100%;min-height:52px}.add{margin-top:12px;border:1px dashed #8eb29a;background:#f8fcf4;color:#2f6941}.generate{margin-top:18px;border:0;background:var(--forest);color:#fff}.error{margin:12px 0 0;color:#ae4d30;font-size:12px;font-weight:700}.output{margin-top:23px}.message{margin:16px 0;padding:17px;border-radius:14px;background:#f5f7f0;white-space:pre-wrap;overflow:auto;font:12px/1.55 Consolas,monospace}.copy{border:1px solid #b9cbbb;background:#fff;color:#315a3d}.wa{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));min-height:54px;border:0;border-radius:999px;padding:0 18px;background:#25d366;color:#073e20;font-weight:850;box-shadow:0 10px 24px #14693a42;cursor:pointer}.wa:disabled,.copy:disabled,.generate:disabled{opacity:.48;cursor:not-allowed}@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}.app{padding-top:46px}}
  </style>
</head>
<body><main class="app"><p class="eyebrow"><span class="mark">C</span>CARVE LAB</p><h1>Heater Scheduler</h1><p class="sub">Set the classes once. Get a clear heater plan in seconds.</p>
<section class="panel"><div class="grid"><label class="field">Date<input id="date" type="date"></label><label class="field">PIC (optional)<input id="pic" placeholder="e.g. Nurin"></label></div><label class="field">WhatsApp number<input id="phone" type="tel" value="60143657688"><span class="note">Include the country code. Spaces, + and hyphens are okay.</span></label><div class="head"><div><h2>Class times</h2><p>Full ON 20 minutes before; back-to-back last 2 rows ON 5 minutes before. OFF after 35 minutes; classes starting 12–3 PM (inclusive) use 30 minutes.</p></div><span class="badge" id="count"></span></div><div class="times" id="times"></div><p id="error" class="error"></p><button class="add" id="add">＋ Add class</button><button class="generate" id="generate">Generate schedule →</button></section>
<section class="panel output" id="output"><div class="head"><div><p class="eyebrow">READY TO SEND</p><h2>Generated schedule</h2></div><span class="badge">Live</span></div><pre class="message" id="message"></pre><button class="copy" id="copy">Copy schedule</button></section><button class="wa" id="wa">◔ WhatsApp</button></main>
<script>
const defaults=['08:15','09:15','10:15','12:15','13:15','15:15'];let times=[...defaults];const $=id=>document.getElementById(id);$('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
function mins(v){let[a,b]=v.split(':').map(Number);return a*60+b}function clock(n){n=(n%1440+1440)%1440;let h=Math.floor(n/60),m=n%60;return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}function valid(){let s=times.filter(Boolean).map(mins).sort((a,b)=>a-b),p=$('phone').value.replace(/\D/g,'');return {s,p,bad:s.some((x,i)=>i&&x-s[i-1]<60),missing:!$('date').value||!s.length,phone:p.length<8||p.length>15}}
function renderTimes(){ $('times').innerHTML='';times.forEach((v,i)=>{let d=document.createElement('div');d.className='row';d.innerHTML=`<input aria-label="Class ${i+1} start time" type="time" value="${v}"><button class="remove">Remove</button>`;d.querySelector('input').oninput=e=>{times[i]=e.target.value;render()};d.querySelector('button').onclick=()=>{if(times.length>1){times.splice(i,1);render()}};$('times').append(d)});$('count').textContent=`${times.length} classes`}
function text(){let{ s,bad,missing,phone}=valid(),d=new Date($('date').value+'T12:00:00'),head=`HEATER SCHEDULE - ${d.getDate()}/${d.getMonth()+1} ${$('pic').value.trim().toUpperCase()}`,intro='SOP:\n• ALL heater ON 20 mins before class\n• Last 2 rows OFF 35 mins after class starts\n• For classes starting 12:00 PM–3:00 PM (inclusive), last 2 rows OFF after 30 mins\n• For back-to-back classes, ON last 2 rows 5 mins before the next class\n• Take photo of DB + time each time switch ON/OFF heater\n\nSCHEDULE:',foot='⚠️ FOR CANCELLED CLASS/ GAP BETWEEN CLASSES:\nDO NOT leave the heater ON. Use → remote OFF heaters 1-by-1 → OFF all switches on DB board.\n\nBefore the next class:\n• Back-to-back class: ON last 2 rows (8 switches DB) 5 mins before\n• After a gap: ON all (DB + Remote) 20 mins before.';let rows=[];s.forEach((x,i)=>{let previous=s[i-1],c=s[i+1]===x+60,back=previous!==undefined&&x-previous===60;rows.push(`${clock(back?x-5:x-20)} – ${back?'ON last 2 rows (8 switches DB)':'ON all (DB + Remote)'}`,`${clock(x+(x>=720&&x<=900?30:35))} – ${c?'OFF last 2 rows (8 switches DB)':'OFF ALL'}`);if(!c&&s[i+1]!=null)rows.push('GAP time')});return {value:`${head}\n\n${intro}\n\n${rows.join('\n\n')}\n\n${foot}`,bad,missing,phone}}
function render(){renderTimes();let r=text();$('message').textContent=r.value;$('error').textContent=r.bad?'Class times must be at least 60 minutes apart.':r.missing?'Enter a date and at least one class time to copy or send.':r.phone?'Enter a valid WhatsApp number with country code to send.':'';}
function ready(needsPhone=false){let r=text();if(r.bad||r.missing||(needsPhone&&r.phone)){render();$('error').scrollIntoView({behavior:'smooth',block:'center'});return false}return true}
['date','pic','phone'].forEach(id=>$(id).oninput=render);$('add').onclick=()=>{times.push('');render()};$('generate').onclick=()=>{if(ready())$('output').scrollIntoView({behavior:'smooth'})};
$('copy').onclick=async()=>{if(!ready())return;try{await navigator.clipboard.writeText(text().value);$('copy').textContent='Copied to clipboard';setTimeout(()=>$('copy').textContent='Copy schedule',1600)}catch(e){let range=document.createRange();range.selectNodeContents($('message'));let selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('error').textContent='Clipboard access was blocked. The schedule is selected—use Copy from your browser menu.'}};
$('wa').onclick=()=>{if(ready(true))window.open('https://wa.me/'+valid().p+'?text='+encodeURIComponent(text().value),'_blank','noopener,noreferrer')};render();
</script></body></html>
